services:
  api:
    build: .
    ports: ["8000:8000"]
    env_file: [.env]
    volumes:
      - ./data:/srv/data
      - ./project.config.json:/srv/project.config.json:ro
    environment:
      APP_DATA_DIR: /srv/data

  # Behind a profile so the default `docker compose up` stays a single
  # container on SQLite -- the single-tenant tier needs no database, and
  # making everyone run one to see the demo is a worse first impression.
  #
  #   docker compose --profile pg up        # api + postgres
  #   docker compose up                     # api only, sqlite
  #
  # Set store_backend to "pgvector" and postgres_dsn in project.config.json
  # to actually use it (see project.config.example.json).
  postgres:
    profiles: ["pg"]
    # pgvector 0.8+ is required, not just preferred: hnsw.iterative_scan lives
    # there, and without it a filtered vector search silently returns fewer
    # rows than asked for -- the failure mode that matters most once rows are
    # scoped per user.
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: rag
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rag"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
