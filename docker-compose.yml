services:
  api:
    build: .
    ports: ["8000:8000"]
    env_file: [.env]
    volumes:
      - ./data:/srv/data
      - ./project.config.json:/srv/project.config.json:ro
    environment:
      APP_DATA_DIR: /srv/data

